<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArtRock — Lista de Tarefas</title>
  <meta name="description" content="Sistema de gestão de tarefas da empresa ArtRock" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Tela de Login ─────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-art">ART</span><span class="brand-rock">ROCK</span>
        <span class="brand-sub">Tarefas</span>
      </div>
      <p class="login-subtitle">Entre com suas credenciais para acessar o sistema.</p>

      <form id="login-form" autocomplete="on">
        <div class="login-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="login-input"
            placeholder="seu@email.com" autocomplete="email" required />
        </div>
        <div class="login-field">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" class="login-input"
            placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="login-btn" id="login-submit">Entrar</button>
      </form>

      <button type="button" class="login-link" id="login-forgot">Esqueci minha senha</button>
    </div>
  </div>

  <!-- ── App (escondido até autenticar) ─────────────────── -->
  <div id="app" style="display:none">

    <!-- ── Sidebar ───────────────────────────────────── -->
    <aside id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-art">ART</span><span class="brand-rock">ROCK</span>
        <span class="brand-sub">Tarefas</span>
      </div>

      <nav class="sidebar-nav">
        <!-- Usuário logado → Configurações (sair, recarregar, timer) -->
        <a href="#settings" class="nav-item nav-user" data-page="settings" title="Configurações">
          <span class="user-avatar nav-user-avatar" id="sidebar-avatar">?</span>
          <span class="nav-user-info">
            <span class="user-name" id="sidebar-username">—</span>
            <span class="user-role" id="sidebar-role">—</span>
          </span>
          <svg class="nav-icon nav-user-gear" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </a>
        <div class="nav-divider"></div>

        <a href="#dashboard" class="nav-item" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm13 3h-2v3h-3v2h3v3h2v-3h3v-2h-3z"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#tasks" class="nav-item" data-page="tasks">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 14l-4-4 1.41-1.41L12 14.17l6.59-6.58L20 9l-8 8z"/>
          </svg>
          <span>Minhas Tarefas</span>
        </a>
        <a href="#delegated" class="nav-item" data-page="delegated">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          <span>Tarefas Delegadas</span>
        </a>
        <a href="#backlog" class="nav-item" data-page="backlog">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H4.99C3.88 3 3 3.9 3 5v14c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"/>
          </svg>
          <span>Backlog</span>
        </a>
        <a href="#admin" class="nav-item hidden" id="nav-admin" data-page="admin">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
          </svg>
          <span>Administração</span>
        </a>
        <a href="#users" class="nav-item hidden" id="nav-users" data-page="users">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
          <span>Gerenciar Usuários</span>
        </a>
      </nav>

      <!-- Timer das tarefas em andamento (components/task-timer.js) — fica no rodapé do menu -->
      <section id="task-timer" class="task-timer hidden" aria-label="Timer das tarefas em andamento"></section>
    </aside>

    <!-- ── Main wrapper ──────────────────────────────── -->
    <div id="main-wrapper">
      <header id="top-header">
        <div class="header-left">
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="header-right">
          <button id="btn-new-task" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Nova Tarefa
          </button>
        </div>
      </header>

      <main id="main-content">
        <div class="loading-state">
          <div class="spinner"></div>
        </div>
      </main>
    </div>

  </div><!-- /#app -->

  <!-- ── Modal overlay ────────────────────────────────── -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="modal-backdrop"></div>
    <div id="modal-scroll-wrap">
      <div id="modal-container"></div>
    </div>
  </div>

  <!-- ── Toast container ──────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- External libraries (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>

  <!-- App entry point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
